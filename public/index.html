<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chickencams</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./app.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  </head>
  <body>
    <div class="min-h-screen bg-zinc-950 text-zinc-100 font-sans">
      <header class="flex items-center justify-between px-6 py-5 bg-zinc-950/80 backdrop-blur border-b border-zinc-800">
        <div class="flex min-w-0 flex-1 items-center gap-6">
          <h1 class="text-base font-semibold tracking-tight" id="siteTitle">Chickencams</h1>
          <div id="aggregatorStatusBar" class="aggregator-status-bar"></div>
        </div>
        <div class="flex items-center gap-3">
          <a class="rounded-md border border-zinc-700 px-3 py-1.5 text-xs hover:bg-zinc-800 transition" href="#settingsCard">
            Settings
          </a>
        </div>
      </header>

      <main class="grid grid-cols-1 gap-4 md:gap-5 p-6">
        <p id="cameraEmptyState" class="text-xs text-zinc-500 hidden">No active streams right now.</p>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5" id="cameraGrid"></section>

        <section class="bg-zinc-900/80 border border-zinc-800 rounded-lg p-4 settings-card" id="settingsCard">
          <div class="settings-card-header">
            <div>
              <h2 class="text-sm font-semibold">Settings</h2>
              <p class="text-xs text-zinc-400">Edit the site title, aggregator host, and camera names right from the dashboard.</p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
            <div>
              <label class="text-xs text-zinc-400" for="siteTitleInput">Title text</label>
              <input id="siteTitleInput" class="config-input" type="text" placeholder="Chickencams" />
            </div>
            <div>
              <label class="text-xs text-zinc-400" for="showTitleToggle">Show title</label>
              <select id="showTitleToggle" class="config-input">
                <option value="true">Show</option>
                <option value="false">Hide</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-zinc-400" for="aggregatorHost">Aggregator IP / host</label>
              <input id="aggregatorHost" class="config-input" type="text" placeholder="192.168.1.50" />
            </div>
          </div>

          <div id="configList" class="config-list"></div>
          <div class="config-actions">
            <button class="rounded-md border border-zinc-700 px-3 py-1.5 text-xs hover:bg-zinc-800 transition" id="saveConfig" type="button">
              Save configuration
            </button>
            <span class="text-xs text-zinc-400" id="configStatus"></span>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
