<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chickencams</title>
    <link rel="stylesheet" href="./app.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  </head>
  <body>
    <div class="min-h-screen bg-zinc-950 text-zinc-100 font-sans">
      <header class="flex items-center justify-between px-6 py-5 bg-zinc-950/80 backdrop-blur border-b border-zinc-800">
        <div class="flex min-w-0 flex-1 items-center gap-6">
          <h1 class="text-base font-semibold tracking-tight" id="siteTitle">Chickencams</h1>
          <div id="aggregatorStatusBar" class="aggregator-status-bar"></div>
        </div>
        <div class="flex items-center gap-3">
          <a class="rounded-md border border-zinc-700 px-3 py-1.5 text-xs hover:bg-zinc-800 transition" href="/config">
            Settings
          </a>
        </div>
      </header>

      <main class="grid grid-cols-1 gap-4 md:gap-5 p-6">
        <p id="cameraEmptyState" class="text-xs text-zinc-500 hidden">No active streams right now.</p>

        <section class="grid camera-grid gap-4 md:gap-5" id="cameraGrid"></section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
